# .github/workflows/stats-collect.yml  (v1 · 2026-11)
# 방문 통계 허브 — GoatCounter 장부를 매일 받아 ①일별 원장(stats-ledger/) 적층
# ②통합 관제판(stats-site/index.html) 생성 후 이 저장소에 커밋한다.
# 네비게이터 빌드와 완전 분리: 별도 워크플로이며, 커밋은 [skip ci]로 어떤 빌드도 일으키지 않는다.
# 열쇠는 이 저장소 Secrets의 GOATCOUNTER_TOKEN 하나만 사용한다.
name: stats-collect

on:
  schedule:
    - cron: '5 0 * * *'          # 매일 09:05 KST
  workflow_dispatch: {}

permissions:
  contents: write                 # 원장·관제판 커밋에만 사용

concurrency:
  group: stats-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Q-PAGE 최신 화면 자료 수신 (종목명 사전용 · 공개 라이브에서)
        run: curl -fsSL "https://gjtjdwns1008-dev.github.io/hrdk-q-page/" -o qpage_live.html

      - name: 장부 수집 → 원장 적층 + 관제판 생성
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then
            echo "::error::GOATCOUNTER_TOKEN 미설정 - Settings > Secrets > Actions 에 등록 필요"; exit 1
          fi
          python tools/build_stats.py qpage_live.html stats-site --ledger stats-ledger 2>&1 | tee stats.log
          { echo '### 방문 통계 수집'; echo '```'; tail -8 stats.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 원장·관제판 커밋 (변경 있을 때만 · 어떤 빌드도 유발하지 않음)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-ledger stats-site
          git diff --cached --quiet && echo "변경 없음 - 커밋 생략" && exit 0
          git commit -m "chore: 방문통계 일별 원장·관제판 갱신 [skip ci]"
          git push
