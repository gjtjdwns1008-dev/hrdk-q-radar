# 마스터 DB(구글시트) 주간 자동 백업 (v2: 격자 재시도 탑재, 2026-08-27)
# · 1슬롯 월 07:00 KST + 2슬롯 월 10:00 KST (1슬롯 성공 시 2슬롯은 조용히 통과)
# · 스크립트 내부: 접속 5회 백오프 + 탭 3회 재시도
name: Weekly sheet backup (Q-RADAR)

on:
  schedule:
    - cron: "0 22 * * 0"     # 월 07:00 KST (1차)
    - cron: "0 1 * * 1"      # 월 10:00 KST (격자 2차 — 이미 성공 시 통과)
  workflow_dispatch: {}       # 수동 실행 (성공 여부와 무관하게 항상 수행)

permissions:
  contents: read
  actions: read               # 오늘 성공 실행 조회용

concurrency:
  group: qradar-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install --quiet gspread oauth2client requests

      - name: 시트 전 탭 CSV 백업 (3중 방어) + 통지
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/backup_sheet_ci.py

      - name: 백업 아티팩트 업로드 (90일 보존)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-backup-${{ github.run_id }}
          path: sheet_backup_out/
          retention-days: 90
          if-no-files-found: ignore
