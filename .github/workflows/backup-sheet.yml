# 마스터 DB(구글시트) 주간 자동 백업 (★2026-08-10 신설)
# · 매주 월요일 07:00 KST — 새벽 분석(00:20~) 및 06:00 재빌드 종료 후
# · 저장: 비공개 아티팩트 90일 보존(자동 만료 = 보존 관리 불필요)
# · 통지: 완료/실패 메일(웹훅) — 파일 대신 실행 페이지 링크
name: Weekly sheet backup (Q-RADAR)

on:
  schedule:
    - cron: "0 22 * * 0"     # 일요일 22:00 UTC = 월요일 07:00 KST
  workflow_dispatch: {}       # 수동 실행(첫 검증용)

concurrency:
  group: qradar-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치 (백업은 경량 — 시트 접근분만)
        run: pip install --quiet gspread oauth2client requests

      - name: 시트 전 탭 CSV 백업 + 통지
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python pipeline/backup_sheet_ci.py

      - name: 백업 아티팩트 업로드 (90일 보존)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-backup-${{ github.run_id }}
          path: sheet_backup_out/
          retention-days: 90
          if-no-files-found: error
