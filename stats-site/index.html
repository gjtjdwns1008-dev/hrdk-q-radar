<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>자격정보 서비스 방문 통계</title><style>
:root{--ink:#1F3A5F;--ink2:#3E6DA8;--gold:#B8860B;--line:#C9CDD4;--bg:#FBFBF8;--card:#FFFFFF}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(1200px 500px at 50% -10%,#EEF3FA 0%,transparent 60%),
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,58,95,.035) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(31,58,95,.035) 31px 32px),
  var(--bg);
  color:#1c232e;font:15px/1.65 -apple-system,"Malgun Gothic","Noto Sans CJK KR",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:36px 20px 70px}
.mast{text-align:center;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:24px 0 16px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
.mast:after{content:"";position:absolute;left:20%;right:20%;bottom:4px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mast h1{margin:0;font:700 31px/1.3 "Nanum Myeongjo","Noto Serif CJK KR",serif;color:var(--ink);letter-spacing:.14em}
.mast .sub{margin-top:8px;color:#5A6472;font-size:12.5px;letter-spacing:.06em}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--ink2);border:1px solid #D7E0EC;background:#fff;border-radius:999px;padding:3px 12px}
.live i{width:7px;height:7px;border-radius:50%;background:#2E8B57;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,139,87,.5)}70%{box-shadow:0 0 0 8px rgba(46,139,87,0)}100%{box-shadow:0 0 0 0 rgba(46,139,87,0)}}
.site{margin-top:40px;opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.site.in{opacity:1;transform:none}
h2{font:700 20px/1.4 "Nanum Myeongjo",serif;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:7px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
h2 .desc{font:400 12.5px/1 sans-serif;color:#5A6472;letter-spacing:.04em}
h2 .badge{margin-left:auto;font:700 10.5px/1 sans-serif;letter-spacing:.1em;color:#fff;background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:3px;padding:4px 8px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);padding:14px 16px;box-shadow:0 1px 0 rgba(31,58,95,.04);transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px rgba(31,58,95,.45)}
.card .k{font-size:12px;color:#5A6472;letter-spacing:.08em}
.card .v{font:700 27px/1.3 "Nanum Myeongjo",serif;color:var(--ink);font-variant-numeric:tabular-nums}
.card .v small{font-size:13px;font-weight:400;color:#5A6472;font-family:sans-serif}
h3{font:700 15px/1.4 "Nanum Myeongjo",serif;color:var(--ink);border-left:4px solid var(--gold);padding-left:10px;margin:22px 0 10px}
.chart{background:var(--card);border:1px solid var(--line);padding:14px 14px 8px;position:relative}
.chart svg{display:block;width:100%;height:150px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;padding:5px 9px;border-radius:4px;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .15s}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #EDEEF0;vertical-align:middle}
tr:last-child td{border-bottom:0}
.rk{width:40px;text-align:center;font-weight:800;color:var(--ink)}
.rk b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px}
.r1 b{background:linear-gradient(135deg,#F3C14B,#B8860B);color:#fff}.r2 b{background:linear-gradient(135deg,#CFD6DE,#9AA6B4);color:#fff}.r3 b{background:linear-gradient(135deg,#D8A47F,#A0612F);color:#fff}
.cd{color:#8A93A0;font-size:12px}
.ct{width:90px;text-align:right;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{width:36%}.bar i{display:block;height:11px;width:0;background:linear-gradient(90deg,var(--ink),var(--ink2));border-radius:2px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.none{text-align:center;color:#8A93A0}
.wait{border:1.2px dashed #B8BFC9;background:rgba(255,255,255,.7);color:#5A6472;padding:26px;text-align:center;font-size:13.5px}
.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);color:#5A6472;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media(max-width:600px){.cards{grid-template-columns:1fr}.bar{display:none}.mast h1{font-size:24px;letter-spacing:.08em}}
@media print{body{background:#fff}.site{opacity:1;transform:none}.bar i{transition:none}}
</style></head><body><div class="wrap">
<div class="mast"><h1>자격정보 서비스 방문 통계</h1>
<div class="sub">Q-PAGE · Q-RADAR 통합 관제 · 집계 개시 <b id="since"></b> · 쿠키 없는 비식별 집계 · 일별 원장 자체 보존(전 기간 누적)</div>
<div class="live"><i></i>오늘 실시간분 포함 · 생성 <span id="gen"></span> KST</div></div>
<div id="sites"></div>
<div class="foot"><span>원천: GoatCounter(개인정보·쿠키 미수집) · 일별 사본을 저장소에 적층해 전 기간 이력 보존 · 매일 아침 자동 갱신</span><span>© HRDK Q-PAGE</span></div>
</div>
<script>
var DATA = {"since": "2026-11-04", "gen": "2026-11-04 17:46", "sites": [{"label": "Q-PAGE", "desc": "자격정보집(상세·원페이지)", "status": "wait"}, {"label": "Q-RADAR", "desc": "우대법령 네비게이터", "status": "on", "total": 0, "home": 0, "qsum": 0, "qcnt": 0, "top": [], "daily": [{"d": "2026-11-04", "n": 0}]}]};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function fmt(n){return (n||0).toLocaleString("ko-KR");}
function countUp(node,to){var t0=null,d=900;function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/d);p=1-Math.pow(1-p,3);node.textContent=fmt(Math.round(to*p));if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function area(daily){
  var W=820,H=150,P=26,n=daily.length;
  var mx=Math.max.apply(null,daily.map(function(d){return d.n;}).concat([1]));
  function X(i){return n<2?W/2:P+i*(W-2*P)/(n-1);}
  function Y(v){return H-22-(v/mx)*(H-46);}
  var pts=daily.map(function(d,i){return X(i)+","+Y(d.n);}).join(" ");
  var areaP="M"+X(0)+","+(H-22)+" L"+pts.split(" ").join(" L")+" L"+X(n-1)+","+(H-22)+" Z";
  var dots=daily.map(function(d,i){return '<circle class="pt" data-d="'+d.d+'" data-n="'+d.n+'" cx="'+X(i)+'" cy="'+Y(d.n)+'" r="4" fill="#1F3A5F"/>';}).join("");
  var labs=daily.map(function(d,i){var s=d.d.slice(5).replace("-","/");return (n>14&&i%2)?"":'<text x="'+X(i)+'" y="'+(H-6)+'" font-size="10" fill="#8A93A0" text-anchor="middle">'+s+'</text>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E6DA8" stop-opacity=".35"/><stop offset="1" stop-color="#3E6DA8" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+areaP+'" fill="url(#g)"/>'
    +'<polyline class="ln" points="'+pts+'" fill="none" stroke="#1F3A5F" stroke-width="2.4" stroke-linejoin="round"/>'
    +dots+labs+'</svg>';
}
DATA.sites.forEach(function(s,si){
  var box=el("div","site");
  var h2=el("h2",null,s.label+' <span class="desc">'+s.desc+'</span>'+(s.status==="on"?'<span class="badge">LIVE</span>':""));
  box.appendChild(h2);
  if(s.status!=="on"){box.appendChild(el("p","wait","집계 적용 대기 중 — 사이트 개설·스니펫 반영 후 자동으로 표출됩니다."));}
  else{
    var cards=el("div","cards");
    [["누적 방문(페이지뷰)",s.total," 회"],["종목 상세 조회",s.qsum," 회 · "+fmt(s.qcnt)+"개 종목"],["목록(홈) 조회",s.home," 회"]].forEach(function(c){
      var card=el("div","card",'<div class="k">'+c[0]+'</div><div class="v"><span class="num">0</span><small>'+c[2]+'</small></div>');
      card.querySelector(".num").dataset.to=c[1];cards.appendChild(card);});
    box.appendChild(cards);
    box.appendChild(el("h3",null,"일별 방문 추이"));
    var ch=el("div","chart",area(s.daily));var tip=el("div","tip");ch.appendChild(tip);box.appendChild(ch);
    ch.addEventListener("mousemove",function(ev){var t=ev.target;if(t.classList&&t.classList.contains("pt")){var r=ch.getBoundingClientRect(),b=t.getBoundingClientRect();tip.style.left=(b.left-r.left+4)+"px";tip.style.top=(b.top-r.top)+"px";tip.innerHTML=t.dataset.d+" · <b>"+fmt(+t.dataset.n)+"회</b>";tip.style.opacity=1;}else tip.style.opacity=0;});
    ch.addEventListener("mouseleave",function(){tip.style.opacity=0;});
    box.appendChild(el("h3",null,"최다 조회 자격 TOP "+Math.max(s.top.length,1)));
    var mx=Math.max.apply(null,s.top.map(function(x){return x.n;}).concat([1]));
    var rows=s.top.map(function(x,i){return '<tr class="r'+(i+1)+'"><td class="rk"><b>'+(i+1)+'</b></td><td class="nm">'+x.nm+'<span class="cd"> '+x.c+(x.et==="과정형"?"·과정평가형":"")+'</span></td><td class="ct">'+fmt(x.n)+'</td><td class="bar"><i data-w="'+(x.n/mx*100).toFixed(0)+'"></i></td></tr>';}).join("")||'<tr><td colspan="4" class="none">아직 상세 조회 기록이 없습니다</td></tr>';
    var tb=el("table",null,rows);box.appendChild(tb);
  }
  document.getElementById("sites").appendChild(box);
});
document.getElementById("since").textContent=DATA.since;
document.getElementById("gen").textContent=DATA.gen;
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var b=e.target;b.classList.add("in");
  b.querySelectorAll(".num").forEach(function(n){countUp(n,+n.dataset.to);});
  setTimeout(function(){b.querySelectorAll(".bar i").forEach(function(i){i.style.width=i.dataset.w+"%";});},250);
  b.querySelectorAll(".ln").forEach(function(l){var len=l.getTotalLength();l.style.strokeDasharray=len;l.style.strokeDashoffset=len;l.getBoundingClientRect();l.style.transition="stroke-dashoffset 1.3s ease";l.style.strokeDashoffset=0;});
  io.unobserve(b);}});},{threshold:.15});
document.querySelectorAll(".site").forEach(function(b){io.observe(b);});
setTimeout(function(){document.querySelectorAll(".site:not(.in)").forEach(function(b){b.classList.add("in");b.querySelectorAll(".num").forEach(function(x){x.textContent=fmt(+x.dataset.to);});b.querySelectorAll(".bar i").forEach(function(x){x.style.width=x.dataset.w+"%";});});},2500);
</script></body></html>
